apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-7a4-gosec-control

# Policy Engine UAT test 7a-4: control test. Runs raw gosec (securego/gosec image) on the planted
# fixture next to the Unify gosec-plugin, to see whether the plugin or the fixture is the problem.
# Tracker: stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan-gosec:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Control - raw gosec on the planted fixture (not read by the policy)
        uses: docker://securego/gosec:latest
        shell: sh
        run: |
          set -u
          G=$(command -v gosec || echo /bin/gosec)
          echo "using $G"
          cd pe-uat-fixtures/gosec-g402
          $G -no-fail -fmt=text ./... || true
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Check policies
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: exit
