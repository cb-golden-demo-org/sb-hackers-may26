schema_version: alpha
name: pe-uat-14b-no-scan - block when no scan data exists
description: PE UAT test 14b (scan required; the workflow has no scan step, so the declared vulnerability_scan subject is missing and the BLOCK policy should stop the run). Repo cb-golden-demo-org/sb-hackers-may26, branch pe-uat-14b-no-scan, workflow pe-uat-14b-no-scan. Policy file policies/pe-uat-14b-no-scan.policy.yaml. Scoped to this one test workflow only. Safe to delete.
category: Security
subjects:
  - type: vulnerability_scan
scope:
  - type: workflow
    org_id: fcf32b98-01a8-4784-80c9-8b44e336644d
    component_id: be226259-df6a-437b-8116-7d8521efc6f4
    workflow_name: pe-uat-14b-no-scan
rules:
  - name: High severity findings
    action: BLOCK
    checks:
      - name: high count above zero
        field: "vulnerability_scan.summary.by_severity.high"
        operator: gt
        value: 0
