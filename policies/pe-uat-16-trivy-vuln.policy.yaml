schema_version: alpha
name: pe-uat-16-trivy-vuln - block when trivy finds vulnerabilities
description: UAT test 16. Safe to delete. Two rules test both field path forms, with and without data.
category: Security
subjects:
  - type: vulnerability_scan
scope:
  - type: job
    org_id: fcf32b98-01a8-4784-80c9-8b44e336644d
    component_id: be226259-df6a-437b-8116-7d8521efc6f4
    workflow_name: pe-uat-16-trivy-vuln
    job_name: scan
    when:
      - exit
rules:
  - name: Path without data
    action: BLOCK
    checks:
      - name: total above zero (no data)
        field: "vulnerability_scan.summary.by_severity.total"
        operator: gt
        value: 0
  - name: Path with data
    action: BLOCK
    checks:
      - name: total above zero (with data)
        field: "vulnerability_scan.data.summary.by_severity.total"
        operator: gt
        value: 0
