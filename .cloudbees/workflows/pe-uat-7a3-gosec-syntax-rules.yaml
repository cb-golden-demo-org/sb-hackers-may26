apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-7a3-gosec-syntax-rules

# Policy Engine UAT test 7a-3: Gosec with G402 plus syntax-only rules G101, G501, G401 in the standalone module
# (pe-uat-fixtures/gosec-g402/main.go, rule G402). Tracker:
# stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan-gosec:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Check policies
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: exit
