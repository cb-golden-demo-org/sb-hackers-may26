schema_version: alpha
name: pe-uat-10-10k-groups-hit - groups all of any(critical or high) and all(medium and total)
description: PE UAT policy lab case 10k-groups-hit - groups all of any(critical or high) and all(medium and total). Expected to fire. Gosec data is critical 0, high 2, medium 2, low 0, total 4. Workflow pe-uat-10-policy-lab only. Safe to delete.
category: Security
subjects:
  - type: vulnerability_scan
scope:
  - type: workflow
    org_id: fcf32b98-01a8-4784-80c9-8b44e336644d
    component_id: be226259-df6a-437b-8116-7d8521efc6f4
    workflow_name: pe-uat-10-policy-lab
rules:
  - name: 10k-groups-hit
    action: WARN
    match: all
    groups:
      - match: any
        checks:
        - name: critical
          field: "vulnerability_scan.summary.by_severity.critical"
          operator: gte
          value: 1
        - name: high
          field: "vulnerability_scan.summary.by_severity.high"
          operator: gte
          value: 1
      - match: all
        checks:
        - name: medium
          field: "vulnerability_scan.summary.by_severity.medium"
          operator: gte
          value: 1
        - name: total
          field: "vulnerability_scan.summary.by_severity.total"
          operator: gte
          value: 4
