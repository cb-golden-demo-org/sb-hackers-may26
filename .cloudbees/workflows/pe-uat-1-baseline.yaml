apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-1-baseline

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Scan with gitleaks
        uses: cloudbees-io/gitleaks-plugin@v1

  deploy:
    needs:
      - scan
    steps:
      - name: Deploy (simulated)
        uses: docker://alpine:3.20
        shell: sh
        run: echo "deploy"
