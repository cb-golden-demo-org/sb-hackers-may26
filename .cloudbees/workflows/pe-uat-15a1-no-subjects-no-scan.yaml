apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-15a1-no-subjects-no-scan

# Policy Engine UAT test 15a1-no-subjects-no-scan (policy without subjects, workflow without scan).
# No scan step, so no subject data is passed to the check step.
# Tracker: stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  build:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Check policies
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          checkpoint-type: workflow
          checkpoint-position: exit
