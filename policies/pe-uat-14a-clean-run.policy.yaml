schema_version: alpha
name: pe-uat-14a-clean-run - block on high severity findings
description: PE UAT test 14a (clean run under a BLOCK policy; Gosec scans a file with no findings, so the rule must not fire and the run must pass). Repo cb-golden-demo-org/sb-hackers-may26, branch pe-uat-14a-clean-run, workflow pe-uat-14a-clean-run. Policy file policies/pe-uat-14a-clean-run.policy.yaml. Scoped to this one test workflow only. Safe to delete.
category: Security
subjects:
  - type: vulnerability_scan
scope:
  - type: workflow
    org_id: fcf32b98-01a8-4784-80c9-8b44e336644d
    component_id: be226259-df6a-437b-8116-7d8521efc6f4
    workflow_name: pe-uat-14a-clean-run
rules:
  - name: High severity findings
    action: BLOCK
    checks:
      - name: high count above zero
        field: "vulnerability_scan.summary.by_severity.high"
        operator: gt
        value: 0
