apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-6-all-scanners

# Policy Engine UAT test 6: every scanner we can run that the policy engine can evaluate.
# Phase 1: gosec, gitleaks (source), trivy, grype (image built from apps/claims-service,
# which compiles the Go code inside its Dockerfile build stage). Tracker:
# stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan-all:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Scan with gitleaks
        id: scan-gitleaks
        uses: cloudbees-io/gitleaks-plugin@v1
      - name: Compile and build image tar (no push)
        uses: docker://gcr.io/kaniko-project/executor:debug
        shell: sh
        run: |
          /kaniko/executor \
            --context /cloudbees/workspace \
            --dockerfile /cloudbees/workspace/apps/claims-service/Dockerfile \
            --no-push \
            --destination claims-service:pe-uat-6 \
            --tarPath /cloudbees/workspace/image.tar
          ls -l /cloudbees/workspace/image.tar
      - name: Scan image with trivy
        id: scan-trivy
        uses: cloudbees-io/trivy-plugin@v2
        with:
          binary-tar-path: /cloudbees/workspace/image.tar
      # Grype disabled 2026-10-30. Its output includes findings with severity INFORMATION, which the
      # policy schema rejects (CRITICAL/HIGH/MEDIUM/LOW only). Evidence:
      #   pe-uat-6b-grype-only run 6f0957d2-e8f0-4a60-9e3c-127916bcaae0: WARN, schema_conformance error
      #   pe-uat-6-all-scanners run 0cab195c-ade1-4861-98d6-edc0981aed69: policy service HTTP 500
      #   pe-uat-6a-trivy-only run a2626238-8f03-4438-b104-41fb83d1fd37 (same without grype): pass
      # Re-enable by removing the "if" line when the policy engine accepts Grype output.
      - name: "DISABLED - Scan image with grype (findings with severity INFORMATION fail policy schema validation)"
        id: scan-grype
        if: ${{ false }}
        uses: cloudbees-io/grype-plugin@v1
        with:
          binary-tar-path: /cloudbees/workspace/image.tar
      - name: Check policies
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-trivy.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: exit

  deploy:
    needs:
      - scan-all
    steps:
      - name: Deploy (simulated)
        uses: docker://alpine:3.20
        shell: sh
        run: echo "deploy"
