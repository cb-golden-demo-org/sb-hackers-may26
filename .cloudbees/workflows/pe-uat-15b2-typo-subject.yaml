apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-15b2-typo-subject

# Policy Engine UAT test 15b2-typo-subject (misspelled subject name at start of field).
# Scan data is valid (Gosec on pe-uat-fixtures/clean, all counts 0), so any difference comes from the policy only.
# Tracker: stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Check policies
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: exit
