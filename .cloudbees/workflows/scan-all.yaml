apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: scan-all

# Reusable workflow: runs every scanner that has worked in the Policy Engine UAT.
# Scan only. It has no policy step and no deploy; the caller decides what to do with the results.
# Needs org properties SONARQUBE_URL, SONARQUBE_USERNAME (variables) and SONARQUBE_PASSWORD (secret),
# so call it with "vars: inherit" and "secrets: inherit".

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        required: false
        default: apps/claims-service/Dockerfile

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        id: scan-gosec
        kind: scan
        uses: cloudbees-io/gosec-plugin@v2
      - name: Scan with gitleaks
        id: scan-gitleaks
        kind: scan
        uses: cloudbees-io/gitleaks-plugin@v1
      - name: Scan with SonarQube
        id: scan-sonarqube
        kind: scan
        uses: cloudbees-io/sonarqube-plugin@v1
        with:
          url: ${{ vars.SONARQUBE_URL }}
          username: ${{ vars.SONARQUBE_USERNAME }}
          password: ${{ secrets.SONARQUBE_PASSWORD }}
      - name: Build image tar (no push)
        uses: docker://gcr.io/kaniko-project/executor:debug
        shell: sh
        run: |
          /kaniko/executor \
            --context /cloudbees/workspace \
            --dockerfile /cloudbees/workspace/${{ inputs.dockerfile }} \
            --no-push \
            --destination scan-all:image \
            --tarPath /cloudbees/workspace/image.tar
      - name: Scan image with trivy
        id: scan-trivy
        kind: scan
        uses: cloudbees-io/trivy-plugin@v2
        with:
          binary-tar-path: /cloudbees/workspace/image.tar
      # Grype is left out on purpose: its INFORMATION-severity findings break the policy evaluation
      # (UAT test 6b). Snyk and Checkmarx One are left out because they need accounts.
