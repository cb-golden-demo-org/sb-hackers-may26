schema_version: alpha
name: pe-uat-9a-gosec-block - block on high severity findings
description: PE UAT test 9a (BLOCK action; Gosec on a repo with a root go.mod and planted findings, so the rule fires and the build should stop). Repo cb-golden-demo-org/sb-hackers-may26, branch pe-uat-9a-gosec-block, workflow pe-uat-9a-gosec-block. Policy file policies/pe-uat-9a-gosec-block.policy.yaml. Scoped to this one test workflow only. Safe to delete.
category: Security
subjects:
