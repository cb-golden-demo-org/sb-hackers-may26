apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: policy-gate-test

# Scanner compatibility harness for the Unify policy engine.
# Stage "Scan" holds one job per scanner under test; stage "Deploy" is simulated and is
# gated by a WARN-only policy at stage entry. Test ONE scanner per run: two scans of the
# same subject type in one run are rejected by the engine.
# No secrets, no registry, no cluster.
metadata:
  stages/v1alpha1:
    - name: Scan
      jobs:
        - scan-sonarqube-bundled
    - name: Deploy
      jobs:
        - deploy-simulated

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan-sonarqube-bundled:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with SonarQube bundled
        id: scan
        uses: cloudbees-io/sonarqube-bundled-sast-scan-code@v2
        with:
          language: LANGUAGE_GO

  deploy-simulated:
    needs:
      - scan-sonarqube-bundled
    steps:
      - name: Simulated deploy
        uses: docker://alpine:3.20
        shell: sh
        run: echo "deploying ${{ cloudbees.scm.sha }}"
