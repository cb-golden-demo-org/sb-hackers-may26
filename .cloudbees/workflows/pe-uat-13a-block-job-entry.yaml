apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-13a-block-job-entry

# Policy Engine UAT test 13 (BLOCK at the deploy job entry): where a BLOCK lands. Gosec data is critical 0, high 2, medium 2, low 0, total 4.
# Tracker: stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan:
    outputs:
      subject: ${{ steps.scan-gosec.outputs.policy-subject }}
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2

  deploy:
    needs:
      - scan
    steps:
      - name: Check - job deploy entry
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ needs.scan.outputs.subject }}
          checkpoint-type: job
          checkpoint-name: deploy
          checkpoint-position: entry
      - name: Deploy (simulated)
        uses: docker://alpine:3.20
        shell: sh
        run: echo "deploy ran, so the block did not stop the deploy"
