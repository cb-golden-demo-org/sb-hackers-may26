apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-12-positions-scope

# Policy Engine UAT test 12: positions (entry, within, exit) and scope (workflow, stage, job).
# One check step per checkpoint. Gosec data is critical 0, high 2, medium 2, low 0, total 4.
# Eight policies in policies/lab3/ are each scoped to one checkpoint; compare where each is evaluated.
# Tracker: stu-claude/investigations/policy-engine-scanner-test-tracker.md

metadata:
  stages/v1alpha1:
    - name: Scan
      jobs:
        - scan
    - name: Deploy
      jobs:
        - deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan:
    outputs:
      subject: ${{ steps.scan-gosec.outputs.policy-subject }}
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Check - workflow entry (no scan data yet)
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          checkpoint-type: workflow
          checkpoint-position: entry
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Check - workflow within
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: within
      - name: Check - job scan within
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: job
          checkpoint-name: scan
          checkpoint-position: within
      - name: Check - stage Scan exit
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: stage
          checkpoint-name: Scan
          checkpoint-position: exit
      - name: Check - workflow exit
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: exit

  deploy:
    needs:
      - scan
    steps:
      - name: Check - job deploy entry
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ needs.scan.outputs.subject }}
          checkpoint-type: job
          checkpoint-name: deploy
          checkpoint-position: entry
      - name: Deploy (simulated)
        uses: docker://alpine:3.20
        shell: sh
        run: echo "deploy"
