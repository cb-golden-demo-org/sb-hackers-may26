apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: pe-uat-10-policy-lab

# Policy Engine UAT policy lab. Gosec on a repo with a root go.mod and planted findings gives
# known data (critical 0, high 2, medium 2, low 0, total 4). About 18 policies in policies/lab/
# are all scoped to this workflow; each states its expected result. Compare with the API.
# Tracker: stu-claude/investigations/policy-engine-scanner-test-tracker.md

on:
  workflow_dispatch:

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  scan-gosec:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Scan with gosec
        id: scan-gosec
        uses: cloudbees-io/gosec-plugin@v2
      - name: Check policies
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-data: ${{ steps.scan-gosec.outputs.policy-subject }}
          checkpoint-type: workflow
          checkpoint-position: exit
